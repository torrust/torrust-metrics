[package]
authors = [
  "Nautilus Cyberneering <info@nautilus-cyberneering.de>, Mick van Dijke <mick@dutchbits.nl>",
]
description = "Prometheus metrics integration library providing type-safe metric collection and aggregation."
documentation = "https://docs.rs/torrust-metrics/"
edition = "2024"
homepage = "https://torrust.com/"
keywords = [ "api", "library", "metrics" ]
license = "AGPL-3.0-only"
name = "torrust-metrics"
publish = true
readme = "README.md"
repository = "https://github.com/torrust/torrust-metrics"
rust-version = "1.88"
version = "0.2.0"

[dependencies]
chrono = { version = "0", default-features = false, features = [ "clock" ] }
derive_more = { version = "2", features = [ "constructor", "display" ] }
openmetrics-parser = "0.4.4"
serde = { version = "1", features = [ "derive" ] }
serde_json = "1.0.140"
thiserror = "2"
torrust-clock = "3.0.0"
tracing = "0.1.41"

[dev-dependencies]
approx = "0.5.1"
formatjson = "0.3.1"
mutants = "0.0.3"
pretty_assertions = "1.4.1"
rstest = "0.25.0"
